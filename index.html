  <script>
    (function () {
      try {
        var stored = localStorage.getItem("portfolio_time_mood_v2") || "auto";
        var valid = ["morning", "afternoon", "evening", "night"];
        var h = new Date().getHours();
        var sys = h >= 5 && h < 12 ? "morning" : h >= 12 && h < 17 ? "afternoon" : h >= 17 && h < 19 ? "evening" : "night";
        var period = valid.indexOf(stored) !== -1
          ? stored
          : stored === "system"
          ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "morning")
          : sys;
        var root = document.documentElement;
        root.classList.add("mood-" + period);
        if (period === "night") root.classList.add("dark");
        var colors = { morning: "#FAF3E6", afternoon: "#F4F5F1", evening: "#E9DAC5", night: "#141210" };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && colors[period]) meta.setAttribute("content", colors[period]);
      } catch (e) {}
    })();
  </script>
